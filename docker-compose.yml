version: '3.8'
services:
    postgres:
        image: 'redgreat/postgres:latest'
        container_name: pg
        hostname: postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: user_eadm
            POSTGRES_DB: eadm
            POSTGRES_PASSWORD: iyS62bvt
            POSTGRES_HOST_AUTH_METHOD: trust
        volumes:
            - pgdata:/var/lib/postgresql/data
        ports:
            - '5432:5432'
    eadm:
        image: 'redgreat/eadm:${EADM_VERSION:-latest}'
        container_name: eadm
        restart: unless-stopped
        build:
            context: .
            dockerfile: Dockerfile
            args:
                DOCKER_IMAGE_VERSION: ${EADM_VERSION:-dev}
                BUILD_PROFILE: ${EADM_BUILD_PROFILE:-prod}
        ports:
            - '8080:8090'
            - '8443:8443'  # HTTPS端口
        volumes:
            - ./docker/db.config:/opt/eadm/config/db.config
            - ./docker/sys.config:/opt/eadm/config/sys.config
            - ./docker/vm.args:/opt/eadm/config/vm.args
            - ./logs/:/opt/eadm/log/:rw
            - ./mnesia_data:/opt/eadm/mnesia:rw
            - ./backups:/opt/eadm/backups:rw
            - ./certs:/opt/eadm/certs:rw  # SSL证书目录
        environment:
            DISABLE_IPV6: 'true'
        depends_on:
            - postgres
        deploy:
            resources:
                limits:
                    memory: 1G
                reservations:
                    memory: 500M
        mem_swappiness: 0
        oom_kill_disable: true
    npm:
        image: 'redgreat/nginxpm:latest'
        container_name: npm
        restart: unless-stopped
        ports:
            - '80:8080'
            - '8181:8181'
            - '443:4443'
        volumes:
            - ./npmdata:/config:rw
        depends_on:
            - eadm
        environment:
            DISABLE_IPV6: 'true'
            TZ: 'Asia/Shanghai'
            LANG: 'zh_CN.UTF-8'
volumes:
    pgdata:
