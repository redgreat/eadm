name: wiki publish
on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish Wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4